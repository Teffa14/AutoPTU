name: Build Vercel source bundle
# Build the deployable Career runtime whenever production-relevant source changes.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-vercel-bundle.yml
      - .vercelignore
      - vercel.json
      - career_app.py
      - auto_ptu/**
      - career_web/**
      - scripts/build_vercel.py
      - public/career-game/**
      - files/**
      - PTUDatabase-main/**
      - "IMPLEMENTATION FILES/**"
      - pyproject.toml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/build-vercel-bundle.yml
      - .vercelignore
      - vercel.json
      - career_app.py
      - auto_ptu/**
      - career_web/**
      - scripts/build_vercel.py
      - public/career-game/**
      - files/**
      - PTUDatabase-main/**
      - "IMPLEMENTATION FILES/**"
      - pyproject.toml

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build current Career frontend
        run: python scripts/build_vercel.py

      - name: Build slim Vercel runtime
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import subprocess
          import zipfile
          from pathlib import Path

          root = Path.cwd()
          out = root / "vercel-slim"
          out.mkdir(parents=True, exist_ok=True)
          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()

          def include(path: Path) -> bool:
              rel = path.relative_to(root).as_posix()
              if not path.is_file():
                  return False
              if rel.startswith("auto_ptu/data/terrain_maps/starter/images/"):
                  return False
              if rel.startswith("auto_ptu/api/static/"):
                  return rel in {
                      "auto_ptu/api/static/character_creation.json",
                      "auto_ptu/api/static/pokemon_move_sources.json",
                  }
              if rel.startswith("files/") and path.suffix.lower() in {".pdf", ".xlsx", ".xls", ".docx"}:
                  return False
              return True

          runtime_roots = [root / "auto_ptu", root / "files", root / "public" / "career-game"]
          runtime_files: list[Path] = [root / "career_app.py"]
          for runtime_root in runtime_roots:
              if runtime_root.exists():
                  runtime_files.extend(path for path in runtime_root.rglob("*") if include(path))

          ptu_yaml = root / "PTUDatabase-main" / "Data" / "ptu.1.05.yaml"
          if ptu_yaml.exists():
              runtime_files.append(ptu_yaml)

          gen9_pbs = (
              root
              / "IMPLEMENTATION FILES"
              / "Generation 9 Pack v3.3.4"
              / "PBS"
              / "pokemon_base_Gen_9_Pack.txt"
          )
          if not gen9_pbs.exists():
              raise FileNotFoundError(f"Required Career Generation 9 PBS is missing: {gen9_pbs}")
          runtime_files.append(gen9_pbs)

          bundle_path = out / "runtime_bundle.zip"
          with zipfile.ZipFile(bundle_path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for path in sorted(set(runtime_files)):
                  archive.write(path, path.relative_to(root).as_posix())
              archive.writestr(".runtime-source.json", json.dumps({"source_commit": sha}) + "\n")

          gen9_archive_path = gen9_pbs.relative_to(root).as_posix()
          career_entry_path = "public/career-game/index.html"
          with zipfile.ZipFile(bundle_path) as archive:
              names = set(archive.namelist())
              if "career_app.py" not in names:
                  raise RuntimeError("Career runtime omitted the thin Career entrypoint")
              if gen9_archive_path not in names:
                  raise RuntimeError(f"Career runtime omitted required PBS: {gen9_archive_path}")
              gen9_text = archive.read(gen9_archive_path).decode("utf-8-sig", errors="replace")
              if "Name = Annihilape" not in gen9_text:
                  raise RuntimeError("Career runtime Generation 9 PBS failed Annihilape smoke check")

              if career_entry_path not in names:
                  raise RuntimeError("Career runtime omitted the browser entrypoint")
              career_html = archive.read(career_entry_path).decode("utf-8", errors="replace")
              if 'id="root"' not in career_html:
                  raise RuntimeError("Career runtime browser entrypoint has no React root")
              if "/career-game/assets/" not in career_html:
                  raise RuntimeError("Career runtime browser entrypoint has no built Career assets")

              source_manifest = json.loads(archive.read(".runtime-source.json").decode("utf-8"))
              if source_manifest.get("source_commit") != sha:
                  raise RuntimeError("Career runtime source provenance does not match the checked-out commit")

          requirements = """typer>=0.12
rich>=13.7
pydantic>=2.8
PyYAML>=6.0
pandas>=2.2
PyPDF2>=3.0
fastapi>=0.115
uvicorn[standard]>=0.30
psycopg[binary]>=3.2
py-trees==2.4.0
trueskill==0.4.5
six>=1.16
pydot>=3.0
"""
          (out / "requirements.txt").write_text(requirements, encoding="utf-8")

          bootstrap = f'''"""Slim Vercel bootstrap generated from AutoPTU {sha}."""\nfrom __future__ import annotations\n\nimport os\nimport shutil\nimport sys\nimport zipfile\nfrom pathlib import Path\n\nSOURCE_COMMIT = "{sha}"\nBUNDLE = Path(__file__).resolve().parent / "runtime_bundle.zip"\nRUNTIME = Path("/tmp/autoptu-runtime")\nMARKER = RUNTIME / ".source-commit"\n\nif not MARKER.exists() or MARKER.read_text(encoding="utf-8", errors="ignore").strip() != SOURCE_COMMIT:\n    shutil.rmtree(RUNTIME, ignore_errors=True)\n    RUNTIME.mkdir(parents=True, exist_ok=True)\n    with zipfile.ZipFile(BUNDLE) as archive:\n        archive.extractall(RUNTIME)\n    MARKER.write_text(SOURCE_COMMIT, encoding="utf-8")\n\nos.environ.setdefault("AUTO_PTU_RUNTIME_ROOT", str(RUNTIME))\nos.environ.setdefault("AUTOPTU_SOURCE_COMMIT", SOURCE_COMMIT)\nsys.path.insert(0, str(RUNTIME))\n\nfrom career_app import app\n\n__all__ = ["app"]\n'''
          (out / "app.py").write_text(bootstrap, encoding="utf-8")
          bootstrap_text = (out / "app.py").read_text(encoding="utf-8")
          if f'SOURCE_COMMIT = "{sha}"' not in bootstrap_text:
              raise RuntimeError("Career deploy bootstrap lost its source commit")
          if "from career_app import app" not in bootstrap_text:
              raise RuntimeError("Career deploy bootstrap bypassed the thin Career entrypoint")
          if "auto_ptu.api.server" in bootstrap_text:
              raise RuntimeError("Career deploy bootstrap imports the full battle server")

          config = {
              "$schema": "https://openapi.vercel.sh/vercel.json",
              "buildCommand": "echo 'Using prebuilt Career runtime'",
              "functions": {"app.py": {"includeFiles": "runtime_bundle.zip"}},
              "env": {
                  "AUTO_PTU_RUNTIME_ROOT": "/tmp/autoptu-runtime",
                  "AUTO_PTU_REPORTS_DIR": "/tmp/autoptu-runtime/reports",
                  "AUTOPTU_BATTLE_LOG_DIR": "/tmp/autoptu-runtime/reports/battle_logs",
                  "AUTO_PTU_SPRITE_DIR": "/tmp/autoptu-runtime/sprites",
                  "AUTO_PTU_POKEAPI_CACHE": "/tmp/autoptu-runtime/pokeapi",
                  "CAREER_BATTLE_EXECUTION": "inline",
              },
          }
          (out / "vercel.json").write_text(json.dumps(config, indent=2) + "\n", encoding="utf-8")
          (out / ".deploy-source.json").write_text(
              json.dumps({
                  "source_commit": sha,
                  "runtime_files": len(runtime_files),
                  "runtime_zip_bytes": bundle_path.stat().st_size,
              }, indent=2) + "\n",
              encoding="utf-8",
          )
          print((out / ".deploy-source.json").read_text())
          PY

      - name: Upload Vercel source bundle
        uses: actions/upload-artifact@v4
        with:
          name: vercel-source
          path: vercel-slim
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
