name: Validate

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Run standard validation
        run: python scripts/validate_repo.py

      - name: Run Career pipeline tests
        run: python -m pytest -q tests/test_career_battle_pipeline.py tests/test_career_rival_training.py tests/test_career_preseason_market.py tests/test_career_pokemon_longevity.py tests/test_career_item_catalog.py tests/test_career_trainer_sprite.py tests/test_career_portable_api.py tests/test_career_save_compatibility.py tests/test_career_capture_overflow.py tests/test_career_decision_resilience.py

      - name: Install Career frontend
        run: npm --prefix career_web ci

      - name: Test Career frontend
        run: npm --prefix career_web test

      - name: Build Career frontend
        run: npm --prefix career_web run build

      - name: Package validated Vercel runtime
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json, subprocess, zipfile
          from pathlib import Path

          root = Path.cwd()
          out = root / "vercel-slim"
          out.mkdir(parents=True, exist_ok=True)
          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()

          def include(path: Path) -> bool:
              rel = path.relative_to(root).as_posix()
              if not path.is_file(): return False
              if rel.startswith("auto_ptu/data/terrain_maps/starter/images/"): return False
              if rel.startswith("auto_ptu/api/static/"):
                  return rel in {"auto_ptu/api/static/character_creation.json", "auto_ptu/api/static/pokemon_move_sources.json"}
              if rel.startswith("files/") and path.suffix.lower() in {".pdf", ".xlsx", ".xls", ".docx"}: return False
              return True

          runtime_files = []
          for base in (root / "auto_ptu", root / "files", root / "public" / "career-game"):
              if base.exists(): runtime_files.extend(p for p in base.rglob("*") if include(p))
          ptu_yaml = root / "PTUDatabase-main" / "Data" / "ptu.1.05.yaml"
          if ptu_yaml.exists(): runtime_files.append(ptu_yaml)

          bundle = out / "runtime_bundle.zip"
          with zipfile.ZipFile(bundle, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for path in sorted(set(runtime_files)): z.write(path, path.relative_to(root).as_posix())
              z.writestr(".runtime-source.json", json.dumps({"source_commit": sha}) + "\n")

          (out / "requirements.txt").write_text("""typer>=0.12
rich>=13.7
pydantic>=2.8
PyYAML>=6.0
pandas>=2.2
PyPDF2>=3.0
fastapi>=0.115
uvicorn[standard]>=0.30
psycopg[binary]>=3.2
py-trees==2.4.0
trueskill==0.4.5
six>=1.16
pydot>=3.0
""", encoding="utf-8")

          (out / "app.py").write_text(f'''"""Slim Vercel bootstrap generated from AutoPTU {sha}."""\nfrom __future__ import annotations\nimport os, shutil, sys, zipfile\nfrom pathlib import Path\nSOURCE_COMMIT = "{sha}"\nBUNDLE = Path(__file__).resolve().parent / "runtime_bundle.zip"\nRUNTIME = Path("/tmp/autoptu-runtime")\nMARKER = RUNTIME / ".source-commit"\nif not MARKER.exists() or MARKER.read_text(encoding="utf-8", errors="ignore").strip() != SOURCE_COMMIT:\n    shutil.rmtree(RUNTIME, ignore_errors=True)\n    RUNTIME.mkdir(parents=True, exist_ok=True)\n    with zipfile.ZipFile(BUNDLE) as archive: archive.extractall(RUNTIME)\n    MARKER.write_text(SOURCE_COMMIT, encoding="utf-8")\nos.environ.setdefault("AUTO_PTU_RUNTIME_ROOT", str(RUNTIME))\nsys.path.insert(0, str(RUNTIME))\nfrom auto_ptu.api.server import app\n__all__ = ["app"]\n''', encoding="utf-8")

          config = {"$schema":"https://openapi.vercel.sh/vercel.json","buildCommand":"echo 'Using prebuilt Career runtime'","functions":{"app.py":{"includeFiles":"runtime_bundle.zip"}},"env":{"AUTO_PTU_RUNTIME_ROOT":"/tmp/autoptu-runtime","AUTO_PTU_REPORTS_DIR":"/tmp/autoptu-runtime/reports","AUTOPTU_BATTLE_LOG_DIR":"/tmp/autoptu-runtime/reports/battle_logs","AUTO_PTU_SPRITE_DIR":"/tmp/autoptu-runtime/sprites","AUTO_PTU_POKEAPI_CACHE":"/tmp/autoptu-runtime/pokeapi","CAREER_BATTLE_EXECUTION":"inline"}}
          (out / "vercel.json").write_text(json.dumps(config, indent=2) + "\n", encoding="utf-8")
          (out / ".deploy-source.json").write_text(json.dumps({"source_commit":sha,"base_product_commit":"15666eb696dd2113ea9e73055a59178ab6a55bfb","runtime_files":len(runtime_files),"runtime_zip_bytes":bundle.stat().st_size}, indent=2) + "\n", encoding="utf-8")
          print((out / ".deploy-source.json").read_text())
          PY

      - name: Upload validated Vercel runtime
        uses: actions/upload-artifact@v4
        with:
          name: vercel-source-final
          path: vercel-slim
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
