name: Validate

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Run standard validation
        run: python scripts/validate_repo.py

      - name: Run Career pipeline tests
        run: python -m pytest -q tests/test_career_battle_pipeline.py tests/test_career_rival_training.py tests/test_career_preseason_market.py tests/test_career_pokemon_longevity.py tests/test_career_trainer_sprite.py tests/test_career_portable_api.py

      - name: Install Career frontend
        run: npm --prefix career_web ci

      - name: Test Career frontend
        run: npm --prefix career_web test

      - name: Build Career frontend
        run: npm --prefix career_web run build
