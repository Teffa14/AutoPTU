name: Validate

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: career_web/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Run standard validation
        run: python scripts/validate_repo.py

      - name: Run Career pipeline tests
        run: python -m pytest -q tests/test_career_battle_pipeline.py tests/test_career_rival_training.py tests/test_career_preseason_market.py tests/test_career_loan_return_preview.py tests/test_career_pokemon_save_progress.py tests/test_career_pokemon_longevity.py tests/test_career_item_catalog.py tests/test_career_trainer_sprite.py tests/test_career_portable_api.py tests/test_career_save_compatibility.py tests/test_career_capture_overflow.py tests/test_career_decision_resilience.py tests/test_career_narrative_resilience.py tests/test_career_relationship_resilience.py tests/test_career_team_training.py tests/test_career_retirement_ownership.py tests/test_career_leaderboard_trainer_name.py tests/test_career_github_pages.py

      - name: Install Career frontend
        run: npm --prefix career_web ci

      - name: Test Career frontend
        run: npm --prefix career_web test

      - name: Build Career frontend for GitHub Pages
        env:
          VITE_API_URL: https://obfecwinjdczsfsperks.supabase.co/functions/v1/career-api
          VITE_SUPABASE_URL: https://obfecwinjdczsfsperks.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_s6QIVkin4pretYIZfS-Mmg_TRi0r3Zl
        run: npm --prefix career_web run build

      - name: Verify Pages asset paths
        shell: bash
        run: |
          test -f public/career-game/index.html
          grep -q '/AutoPTU/career-game/assets/' public/career-game/index.html
