name: One-shot Color Change scope fix

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-color-change-fix.yml
      - tests/test_color_change_payload_scope.py

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch Color Change payload scope
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('auto_ptu/rules/battle_state.py')
          source = path.read_text(encoding='utf-8')
          before = '''                        events.append(payload)\n                        self.log_event(payload)\n                    if (\n                        hit\n                        and defender is not None\n                        and defender_id is not None\n                        and bool(result.get("critical"))\n'''
          after = '''                            events.append(payload)\n                            self.log_event(payload)\n                    if (\n                        hit\n                        and defender is not None\n                        and defender_id is not None\n                        and bool(result.get("critical"))\n'''
          matches = source.count(before)
          if matches != 1:
              raise SystemExit(f'Expected exactly one Color Change payload-scope match, found {matches}')
          path.write_text(source.replace(before, after, 1), encoding='utf-8')
          PY

      - name: Verify regression
        run: |
          python -m pytest -q tests/test_color_change_payload_scope.py
          python -m py_compile auto_ptu/rules/battle_state.py

      - name: Commit verified source fix and remove helper workflow
        run: |
          rm .github/workflows/one-shot-color-change-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auto_ptu/rules/battle_state.py .github/workflows/one-shot-color-change-fix.yml
          git commit -m "fix: keep Color Change payload inside type-change guard"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
