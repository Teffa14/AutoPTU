name: Patch Color Change payload crash

on:
  push:
    branches:
      - fix/color-change-payload-crash
    paths:
      - .github/workflows/patch-color-change-payload.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/color-change-payload-crash
      - name: Patch Color Change and add regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('auto_ptu/rules/battle_state.py')
          text = path.read_text(encoding='utf-8')
          anchor = 'and defender.has_ability("Color Change")'
          start = text.index(anchor)
          end = text.index('                    if (\n                        hit', start)
          block = text[start:end]
          old = '                        events.append(payload)\n                        self.log_event(payload)\n'
          new = '                            events.append(payload)\n                            self.log_event(payload)\n'
          if block.count(old) != 1:
              raise SystemExit(f'expected one Color Change event append pair, found {block.count(old)}')
          block = block.replace(old, new, 1)
          text = text[:start] + block + text[end:]
          path.write_text(text, encoding='utf-8')
          PY

          cat > tests/test_color_change_payload_regression.py <<'PY'
          import random

          from auto_ptu.data_models import MoveSpec, PokemonSpec
          from auto_ptu.rules import BattleState, GridState, PokemonState, TrainerState


          class FixedRNG(random.Random):
              def randint(self, a, b):
                  return b


          def _spec(name, *, types, ability=None, moves=None):
              abilities = [{"name": ability}] if ability else []
              return PokemonSpec(
                  species=name,
                  level=20,
                  types=types,
                  hp_stat=10,
                  atk=10,
                  defense=10,
                  spatk=10,
                  spdef=10,
                  spd=10,
                  moves=moves or [],
                  abilities=abilities,
                  items=[],
                  movement={"overland": 4},
                  weight=5,
              )


          def test_color_change_same_type_does_not_append_uninitialized_payload():
              move = MoveSpec(
                  name="Play Nice",
                  type="Normal",
                  category="Status",
                  db=0,
                  ac=2,
                  range_kind="Ranged",
                  range_text="Range 6, 1 Target",
              )
              attacker = PokemonState(
                  spec=_spec("Attacker", types=["Normal"], moves=[move]),
                  controller_id="a",
                  position=(2, 2),
                  active=True,
              )
              defender = PokemonState(
                  spec=_spec("Defender", types=["Normal"], ability="Color Change", moves=[move]),
                  controller_id="b",
                  position=(2, 3),
                  active=True,
              )
              battle = BattleState(
                  trainers={
                      "a": TrainerState(identifier="a", name="A", team="players"),
                      "b": TrainerState(identifier="b", name="B", team="foes"),
                  },
                  pokemon={"a-1": attacker, "b-1": defender},
                  grid=GridState(width=8, height=8),
              )
              battle.rng = FixedRNG()

              battle.resolve_move_targets("a-1", move, "b-1", defender.position)

              assert defender.spec.types == ["Normal"]
              assert not any(
                  event.get("type") == "ability"
                  and event.get("ability") == "Color Change"
                  and event.get("effect") == "type_change"
                  for event in battle.log
              )
          PY

          python -m pytest -q tests/test_color_change_payload_regression.py
          python -m py_compile auto_ptu/rules/battle_state.py
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auto_ptu/rules/battle_state.py tests/test_color_change_payload_regression.py
          git commit -m "fix: guard Color Change event payload"
          git push origin HEAD:fix/color-change-payload-crash
